name: Build RefMatch for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find kildekoden
        shell: bash
        run: |
          if test -f RefMatch-0.4-StreamMode-SOURCE/RefMatch/CMakeLists.txt; then
            echo "REFMATCH_SOURCE=RefMatch-0.4-StreamMode-SOURCE/RefMatch" >> "$GITHUB_ENV"
          elif test -f RefMatch/CMakeLists.txt; then
            echo "REFMATCH_SOURCE=RefMatch" >> "$GITHUB_ENV"
          else
            echo "RefMatch/CMakeLists.txt was not found"
            exit 1
          fi

      - name: Konfigurer
        run: cmake -S "$REFMATCH_SOURCE" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DBUILD_TESTING=ON

      - name: Byg AU, VST3, Standalone og kontrolapp
        run: cmake --build build --config Release --parallel

      - name: Test fade og skiftelogik
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verificer og pak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p RefMatch-Build
          for entry in "AU/RefMatch.component" "VST3/RefMatch.vst3" "Standalone/RefMatch.app"; do
            bundle="build/RefMatch_artefacts/Release/$entry"
            helper="$bundle/Contents/Resources/RefMatch Control.app"
            test -d "$helper"
            codesign --verify --strict "$helper"
            codesign --verify --deep --strict "$bundle"
            codesign -d --entitlements :- "$helper" > helper-entitlements.plist
            /usr/libexec/PlistBuddy -c "Print :com.apple.security.automation.apple-events" helper-entitlements.plist | grep -q true
            /usr/libexec/PlistBuddy -c "Print :NSAppleEventsUsageDescription" "$helper/Contents/Info.plist"
            ditto "$bundle" "RefMatch-Build/$(basename "$bundle")"
          done
          cp "$REFMATCH_SOURCE/../INSTALL-DA.txt" RefMatch-Build/
          ditto -c -k --keepParent RefMatch-Build RefMatch-0.4.1-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RefMatch-0.4.1-StreamMode-macOS
          path: RefMatch-0.4.1-macOS.zip
          if-no-files-found: error
